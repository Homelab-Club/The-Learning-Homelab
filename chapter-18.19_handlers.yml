---
- name: Test Ansible Handler
  hosts: linux_servers
  become: true

  tasks:
    - name: Create a test configuration file
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          homelab_test=true
        dest: /etc/homelab-test.conf
        mode: '0644'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted
